# Local Astral Reach development server. Start from the repository root.
[net]
bindto = "127.0.0.1,::1"
port = 1212
upnp = false

[status]
enabled = true
bind = "localhost:1212"

[game]
hostname = "Astral Reach — Development"

[auth]
mode = 1
allowlocal = true

[hub]
advertise = false

[build]
fork_id = "astral-reach"
engine_version = "289.0.0"
